name: myestro

services:
  # ==================== NEXTCLOUD ====================
  nextcloud-db:
    image: mariadb:latest
    container_name: myestro-nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_ROOT_PASSWORD: "${NEXTCLOUD_DB_ROOT_PASSWORD}"
      MYSQL_PASSWORD: "${NEXTCLOUD_DB_PASSWORD}"
    volumes:
      - ./nextcloud/db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost || mysqladmin ping -h localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 90s

  nextcloud:
    image: nextcloud:latest
    container_name: myestro-nextcloud
    restart: unless-stopped
    depends_on:
      - nextcloud-db
    networks:
      - default
      - bridgecade_web
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: "${NEXTCLOUD_DB_PASSWORD}"
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: "${NEXTCLOUD_ADMIN_PASSWORD}"
      OVERWRITEHOST: "nextcloud.${BASE_DOMAIN}"
      OVERWRITEPROTOCOL: "https"
    volumes:
      - ./nextcloud/html:/var/www/html
    labels:
      caddy: "nextcloud.${BASE_DOMAIN}"
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.tls: "/certs/nextcloud.${BASE_DOMAIN}.crt /certs/nextcloud.${BASE_DOMAIN}.key"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/login || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 120s
    stop_grace_period: 120s

  nextcloud-cron:
    image: nextcloud:latest
    container_name: myestro-nextcloud-cron
    restart: unless-stopped
    depends_on:
      - nextcloud
    networks: [default]
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: "${NEXTCLOUD_DB_PASSWORD}"
    volumes:
      - ./nextcloud/html:/var/www/html:ro
    entrypoint: /cron.sh
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== SOLIDTIME ====================
  solidtime-db:
    image: postgres:latest
    container_name: myestro-solidtime-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: solidtime
      POSTGRES_USER: solidtime
      POSTGRES_PASSWORD: "${SOLIDTIME_DB_PASSWORD}"
    volumes:
      - solidtime-db-data:/var/lib/postgresql
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solidtime -d solidtime || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 60s

  solidtime-app:
    image: solidtime/solidtime:latest
    container_name: myestro-solidtime-app
    restart: unless-stopped
    user: "1000:1000"
    environment:
      CONTAINER_MODE: http
      AUTO_DB_MIGRATE: "true"
    env_file:
      - solidtime.env
    volumes:
      - solidtime-app-storage:/var/www/html/storage
      - ./solidtime/logs:/var/www/html/storage/logs
      - ./solidtime/app-storage:/var/www/html/storage/app
    networks:
      - default
      - bridgecade_web
    depends_on:
      - solidtime-db
    labels:
      caddy: "solidtime.${BASE_DOMAIN}"
      caddy.reverse_proxy: "{{upstreams 8000}}"
      caddy.tls: "/certs/solidtime.${BASE_DOMAIN}.crt /certs/solidtime.${BASE_DOMAIN}.key"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  solidtime-scheduler:
    image: solidtime/solidtime:latest
    container_name: myestro-solidtime-scheduler
    restart: unless-stopped
    user: "1000:1000"
    environment:
      CONTAINER_MODE: scheduler
    env_file:
      - solidtime.env
    volumes:
      - solidtime-app-storage:/var/www/html/storage
      - ./solidtime/logs:/var/www/html/storage/logs
      - ./solidtime/app-storage:/var/www/html/storage/app
    networks: [default]
    depends_on:
      - solidtime-db
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' || pgrep -f artisan || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  solidtime-queue:
    image: solidtime/solidtime:latest
    container_name: myestro-solidtime-queue
    restart: unless-stopped
    user: "1000:1000"
    environment:
      CONTAINER_MODE: worker
      WORKER_COMMAND: "php /var/www/html/artisan queue:work"
    env_file:
      - solidtime.env
    volumes:
      - solidtime-app-storage:/var/www/html/storage
      - ./solidtime/logs:/var/www/html/storage/logs
      - ./solidtime/app-storage:/var/www/html/storage/app
    networks: [default]
    depends_on:
      - solidtime-db
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ==================== HOMEPAGE ====================
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: myestro-homepage
    restart: unless-stopped
    networks:
      - bridgecade_web
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "page.synth.home.arpa"
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      caddy: "page.${BASE_DOMAIN}"
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.tls: "/certs/page.${BASE_DOMAIN}.crt /certs/page.${BASE_DOMAIN}.key"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  solidtime-db-data:
  solidtime-app-storage:

networks:
  bridgecade_web:
    external: true
